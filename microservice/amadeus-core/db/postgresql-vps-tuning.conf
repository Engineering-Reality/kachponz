# PostgreSQL tuning for a 2 vCPU / 4 GB VPS running amadeus-core alongside
# the app processes (NOT a dedicated DB box) — see docs/vps-deployment.md.
#
# Budget rationale: production-mode app stack (Fastify + mcpAutoManager +
# frontend standalone + 2 MCP tools) measures ~670MB RSS idle (see
# scripts/measure-footprint.mjs); OS + nginx + misc ~300-500MB. That leaves
# roughly 1-1.5GB that's safe to hand to PostgreSQL without starving the app,
# with the 2GB swap file (docs/vps-deployment.md) as a safety net, not a
# substitute for right-sizing this.
#
# Install on Ubuntu: copy this file to /etc/postgresql/16/main/conf.d/ and
# reload (`systemctl reload postgresql`). Ubuntu's default postgresql.conf
# already has `include_dir 'conf.d'`, so no further wiring is needed.

# ── Connections ──────────────────────────────────────────────────────────
# amadeus-core's pool defaults to PG_POOL_MAX=10 (src/db/pool.ts /
# src/config/env.ts). max_connections must stay comfortably above that to
# leave room for `psql`/pg_dump/monitoring without contention; it does NOT
# need to scale with concurrent HTTP requests since those share the pool.
max_connections = 20

# ── Memory ────────────────────────────────────────────────────────────────
# Modest shared_buffers: this is a shared box, not a dedicated DB server, so
# we deliberately do NOT follow the usual "25% of RAM" rule of thumb (that
# assumes Postgres owns the machine).
shared_buffers = 256MB
# Informational only (helps the planner reason about OS cache; doesn't
# allocate memory itself) — set to roughly (shared_buffers + expected free
# OS page cache), not the full 4GB.
effective_cache_size = 1GB
# Per sort/hash operation, not per connection — worst case with
# max_connections=20 and one sort each is ~320MB, which fits the budget.
# RAG/pgvector similarity queries and knowledge-base joins are the main
# consumers here; raise cautiously if EXPLAIN ANALYZE shows disk-based
# sorts under real load.
work_mem = 16MB
# Used by VACUUM, CREATE INDEX, and the pgvector HNSW index build
# (migrations/1795000000000_add_rag.ts) — these run infrequently /
# one-at-a-time, so a larger value here is safe even on a small box.
maintenance_work_mem = 128MB

# ── WAL / checkpoints ─────────────────────────────────────────────────────
# Spreads checkpoint I/O instead of bursting, standard recommendation for
# any non-toy deployment.
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# ── Storage (assumes NVMe SSD per the VPS spec in docs/vps-deployment.md) ─
random_page_cost = 1.1
effective_io_concurrency = 200
