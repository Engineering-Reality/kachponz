# Reverse proxy for the Amadeus Orchestrator stack — reference config, adapt
# hostnames/cert paths to your infra. TLS termination + ciphers follow
# microservice/amadeus-core/docs/deployment.md's existing guidance (TLS 1.3,
# fallback 1.2, CISO-mandated cipher list).
#
# Two upstreams because they're genuinely two separate origins:
#   - frontend (Next.js, human dashboard + its own /api/orchestrator/* proxy
#     routes) on 127.0.0.1:3000
#   - amadeus-core (robot/A2A machine API, e.g. POST /a2a/rpc,
#     GET /a2a/tasks/:id/stream, /transactions/*) on 127.0.0.1:8081
# A path-prefix rewrite under one server block is avoidable/fragile here —
# a dedicated api. subdomain is simpler and doesn't need `proxy_pass` prefix
# stripping. Use the same cert (SAN or wildcard) for both if convenient.

upstream amadeus_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream amadeus_core {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name amadeus.internal.example.com;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/ssl/amadeus/fullchain.pem;
    ssl_certificate_key /etc/ssl/amadeus/privkey.pem;

    location / {
        proxy_pass http://amadeus_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name api.amadeus.internal.example.com;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/ssl/amadeus/fullchain.pem;
    ssl_certificate_key /etc/ssl/amadeus/privkey.pem;

    # /a2a/tasks/:id/stream (src/orchestrator/routes.ts) is a long-lived
    # text/event-stream response — proxy_buffering must stay off or nginx
    # will hold the whole stream before forwarding it, defeating SSE.
    # Applied at the server level since it's harmless for the regular JSON
    # endpoints on this same upstream too.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://amadeus_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE clients must not get a cached/stale response.
        proxy_set_header Cache-Control no-cache;
    }
}
